hero:
  title: Джулия Тодорова, клиничен психолог и психотерапевт в София
  paragraphs:
    - Предлагам психоаналитична психотерапия, в София (център), осигурявайки поверително пространство, в което да говорите и да бъдете чути.
    - Работата може да бъде краткосрочна или дългосрочна, в зависимост от въпросите, които Ви водят тук. Сесиите се ръководят от това, което Вие носите, а не от предварително зададени цели или техники.
    - Ако желаете да обсъдите възможност за първоначална консултация, можете да се свържете с мен.
  points:
    - Работя с възрастни, юноши и родители
    - Предлагам консултации на място и онлайн
about:
  title: Квалификация и професионален опит
  text: Завършила съм бакалавърска програма по психология, със специализация „клинична психология“ и магистърска програма по „Клинична психология – психоаналитична перспектива“ в Нов български университет.
  experience_title: "Имам над 10 години опит в клиничната практика и консултирането, който включва работа в:"
  experience:
    - Клиника по психиатрия на Военномедицинска академия.
    - Национална специализирана болница за активно лечение на хематологични заболявания.
    - Център за обществена подкрепа към [ИСДП](https://sapibg.org/bg).
  memberships_title: "Специализации и членства:"
  memberships:
    - Кандидат-регистриран анализант към [Българско психоаналитично общество](https://www.psychoanalysis.bg/), съставно общество на [Международната психоаналитична асоциация](https://www.ipa.world/IPA/Dev/Our_Org/Societies/SharedContent/SocietyMaster.aspx?ContactKey=8a3a1b31-9190-4e62-b5f4-78b2bbd3730c&ID=158153&CCOCommittee=1#CCOCommittee).
    - Психодрама-консултант към Фондация „Психотерапия 2000“ и Център за култура и дебат „Червената къща „Андрей Николов“.
    - Асоцииран член на [Българско психоаналитично общество](https://www.psychoanalysis.bg/?page_id=2774).
    - Член на [Дружеството на психолозите в България](http://psychology-bg.org/new-register/profile/?id=102369).
help:
  title: С какво мога да помогна
  text: "Причините и функцията за преживяването на тревожност при един човек никога не са напълно същите като при друг човек – затова е необходимо индивидуално изследване. Универсален, стандартизиран, терапевтичен подход не оставя пространство за това. Психоаналитичният подход поставя на фокус личното страдание или затруднение и е създаден по начин, който позволява да работи с всеки от въпросите:"
  topics:
    - Тревожност
    - Паник атаки
    - Професионално прегаряне
    - Депресия
    - Скръб и загуба
    - Житейска криза
    - Стрес
    - Гневни чувства или агресивни изблици
    - Самочувствие и вземане на решения
    - Трудности, свързани с образа на тялото и идентичността
    - Изолация и самота
    - Трудности във взаимоотношенията с другите
    - Сексуална ориентация и сексуална идентичност
    - Физически симптоми, които нямат медицинско обяснение
approach:
  title: Как протича психоаналитичната психотерапия
  quote: „Понякога първата стъпка не е да имаме готов отговор, а да имаме място, където можем спокойно да чуем себе си.“
  paragraphs:
    - Психоаналитичният подход предлага възможност да говорите за това, което наистина има значение за Вас, свободно и без осъждане.
    - Това може да се окаже предизвикателен процес и в началото да бъде трудно да изразите какво Ви тревожи. Възможно е да чувствате необходимост от промяна, но да не можете ясно да кажете какво искате от живота си или какво Ви възпрепятства да следвате желанията си.
    - Може да чувствате объркване, съжаление или отчаяние. Да преживявате криза в работата, любовта или отношенията Ви с близки хора. Психоаналитичната психотерапия предлага начин да започнете да намирате думи за онова, което изглежда неясно или недостъпно.
    - Психоаналитичният подход е процес без предварително зададен край и с изследователски характер, работа, движена от любопитство. Може да предложи пространство за размисъл върху въпроси на идентичността, сексуалността или други аспекти на Вашия опит, които може да преживявате като несигурни или трудни за разглеждане другаде. Възможно е също да предприемете краткосрочна работа, насочена към конкретна трудност.
    - "Няма готови решения. Вместо това процесът на работа включва специфичен начин на слушане и поставяне на въпроси, които произлизат от Вашата уникалност: историята Ви, начинът Ви на живот и присъствие в света и ролята на несъзнаваните процеси в развитието на житейския Ви опит."
    - Често се случва настоящите трудности, независимо дали усещането за тях е като симптоми, повтарящи се модели на поведение или постоянни въпроси, да са свързани с по-ранни преживявания, които не са напълно осъзнати. Психодинамичната работа прави възможно доближаването до тези подлежащи структури.
    - "С течение на времето това може да създаде възможност да се появи нещо ново: различен начин да разбирате себе си и да се отнасяте към онова, което досега е изглеждало непроменимо или по неудовлетворяващ начин повтарящо се."
